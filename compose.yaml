# Local development database. Production compose files live with the deploy runbook.
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-troba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troba}
      POSTGRES_DB: ${POSTGRES_DB:-troba}
    ports:
      # Loopback only: never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
