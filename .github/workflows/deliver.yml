name: Deliver

# Every push to main builds ghcr.io/<owner>/troba-web:<sha> once. release-please keeps a release
# PR open; when merging it creates a release, that commit's image gets the :<version> tag without
# a rebuild (ADR-0009). Deploys are added later (T8, T9).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      # Actions are pinned to a commit; the comment is the release it points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        # GHCR names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/troba-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          # The source label links the package to this repo in GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two runs editing the release PR at once would race; queue them instead.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Reads release-please-config.json and .release-please-manifest.json. The release PR is
      # updated with GITHUB_TOKEN, so it doesn't trigger CI, and each push to main replaces its
      # branch. Close and reopen it right before merging to run the checks.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # A release is reported only once. If this job fails, use "Re-run failed jobs" (it keeps the
  # release outputs); "Re-run all jobs" would find the release already created and skip it.
  release-image:
    needs: [image, release]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      SHA: ${{ needs.release.outputs.sha }}
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release commit's image with the version
        # With a single source, imagetools copies the manifest as is, so the digest doesn't change.
        # The release commit's image may come from an earlier, still running push, so wait for it.
        run: |
          for _ in $(seq 90); do
            docker buildx imagetools inspect "$IMAGE:$SHA" > /dev/null 2>&1 && break
            sleep 10
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$SHA"
          src=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE:$SHA")
          dst=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE:$VERSION")
          echo "$IMAGE:$SHA $src"
          echo "$IMAGE:$VERSION $dst"
          if [ "$src" != "$dst" ]; then
            echo "::error::$VERSION points to $dst, expected $src"
            exit 1
          fi
