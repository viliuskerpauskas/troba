name: Deliver

# Every push to dev or main runs CI, then builds ghcr.io/<owner>/troba-web:<sha> once. A push to dev
# deploys it to staging (ADR-0013); a push to main, which only the owner's merge of a dev -> main PR
# makes, deploys it to production (ADR-0014), and main is merged back into dev. On main,
# release-please also keeps a release PR open; merging it creates a release, and the release
# commit's image gets the :<version> tag without a rebuild (ADR-0009).

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # Pushes to dev skip the PR checks, so staging only gets a commit that passed them here.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      # Actions are pinned to a commit; the comment is the release it points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        # GHCR names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/troba-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          # The source label links the package to this repo in GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy.sh on the VPS pulls the image, migrates, swaps web and waits for /api/health to report
  # this sha, rolling back if it doesn't; its exit code fails this job. The SSH key's forced command
  # (deploy/ci-deploy.sh) fixes the environment, so all this job sends is the sha.
  deploy-staging:
    needs: image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # A deploy that fails its health check and rolls back takes about 5 minutes.
    timeout-minutes: 10
    environment: staging
    # One deploy at a time, never cancelled midway. A newer run waiting here replaces an older one
    # that hasn't started. Runs queue in the order their images finish, so if two pushes' builds
    # finish out of order, staging stays on the older sha until the next push.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions: {}

    steps:
      - name: Deploy over SSH
        # Environment secrets of "staging" (docs/ops/vps-setup.md). The host and its key stay out of
        # the public repo and the logs.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Keepalives notice a dead connection; deploy.sh rolls back when its session goes away.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "deploy@$SSH_HOST" "$GITHUB_SHA"

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two runs editing the release PR at once would race; queue them instead.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Reads release-please-config.json and .release-please-manifest.json. The release PR is
      # updated with GITHUB_TOKEN, so it doesn't trigger CI, and each push to main replaces its
      # branch. Close and reopen it right before merging to run the checks.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # It defaults to the repository's default branch, which is dev.
          target-branch: main

  # A release is reported only once. If this job fails, use "Re-run failed jobs" (it keeps the
  # release outputs); "Re-run all jobs" would find the release already created and skip it.
  release-image:
    needs: [image, release]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      SHA: ${{ needs.release.outputs.sha }}
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release commit's image with the version
        # With a single source, imagetools copies the manifest as is, so the digest doesn't change.
        # The release commit's image may come from an earlier, still running push, so wait for it.
        run: |
          for i in $(seq 90); do
            docker buildx imagetools inspect "$IMAGE:$SHA" > /dev/null 2>&1 && break
            if [ "$i" -eq 90 ]; then
              echo "::error::$IMAGE:$SHA didn't appear within 15 minutes"
              exit 1
            fi
            sleep 10
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$SHA"
          src=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE:$SHA")
          dst=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE:$VERSION")
          echo "$IMAGE:$SHA $src"
          echo "$IMAGE:$VERSION $dst"
          if [ "$src" != "$dst" ]; then
            echo "::error::$VERSION points to $dst, expected $src"
            exit 1
          fi

  # Merging into main is the owner's approval, so prod deploys with no further step. Staging ran
  # dev's tip; main's merge commit has the same tree under a new sha, so it gets its own CI run and
  # image here. Each release-please PR merge is a push too, and redeploys with the new version.
  deploy-prod:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The "production" environment only accepts deploys from main.
    environment: production
    # One prod deploy at a time, never cancelled midway, as for staging.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions: {}

    steps:
      - name: Deploy over SSH
        # Environment secrets of "production", for a key forced to run ci-deploy.sh prod. Keepalives
        # as for staging.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "deploy@$SSH_HOST" "$GITHUB_SHA"

  # main gets commits dev doesn't have: each dev -> main PR's merge commit, and release-please's
  # release commits. Merge them into dev so the next dev -> main PR is up to date with main, as the
  # ruleset requires; usually that's a fast-forward. GITHUB_TOKEN's push triggers no workflow, so
  # staging isn't redeployed for it. A conflict fails this job: merge origin/main into dev by hand.
  sync-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Keeps the token in .git/config, which the push below needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -m "chore: merge main into dev" origin/main
          git push origin HEAD:dev
