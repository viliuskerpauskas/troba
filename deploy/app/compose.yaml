# One troba environment on the VPS: web, its one-shot migrate and Postgres. Staging and prod are
# two Compose projects from this file, each with its own env file, database and volumes:
#   docker compose -p troba-<env> -f /srv/troba/deploy/app/compose.yaml --env-file /srv/troba/<env>/.env ...
# deploy.sh runs it; see docs/ops/vps-setup.md. TROBA_SHA (the image tag) comes from deploy.sh.
services:
  web:
    image: ${TROBA_IMAGE:?set in the env file}:${TROBA_SHA:?set by deploy.sh}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-troba}:${POSTGRES_PASSWORD:?set in the env file}@postgres:5432/${POSTGRES_DB:-troba}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in the env file}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set in the env file}
    volumes:
      # A named volume starts as a copy of the image's /data/uploads, so it's owned by node (uid 1000).
      - uploads:/data/uploads
    networks:
      default:
      # Caddy reaches this container as <env>-web on the shared edge network. No ports are published.
      edge:
        aliases: ["${TROBA_ENV:?set in the env file}-web"]
    depends_on:
      postgres:
        condition: service_healthy

  # Not started by `up`; deploy.sh runs it with `docker compose run --rm migrate` before swapping web.
  migrate:
    image: ${TROBA_IMAGE}:${TROBA_SHA}
    profiles: [tools]
    command: ["node", "migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-troba}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-troba}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Keep in step with the root compose.yaml.
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-troba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-troba}
    # No ports: Postgres is reachable only from this project's own network.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  uploads:

networks:
  edge:
    external: true
